[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-customer-support"
version = "1.0.0"
description = "Customer Support Ticket Triage Environment for OpenEnv"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",
    "openai==1.6.1",
    "requests==2.31.0",
]

[project.scripts]
start = "app:main"
inference = "inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "inference"]